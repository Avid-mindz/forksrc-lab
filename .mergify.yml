# i3484 direct-merge command fixture (public repo, no secrets)
# Auto-merge action exists but is deliberately unsatisfiable: pr-absent-gate is never posted.
pull_request_rules:
  - name: i3484-automerge-never
    conditions:
      - base = main
      - check-success = pr-absent-gate
    actions:
      merge:
        method: squash
queue_rules:
  - name: forkgate
    queue_conditions:
      - base = main
    merge_conditions:
      - base = main
      - check-success = forksrc-gate
      - check-success = forksrc-hold
    merge_method: squash
